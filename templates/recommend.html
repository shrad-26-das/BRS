<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfIQ | Find Recommendations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #030712;
            --card:   rgba(17, 24, 39, 0.6);
            --panel:  rgba(17, 24, 39, 0.85);
            --accent: #10b981;
            --accent-gradient: linear-gradient(135deg, #10b981, #059669);
            --text:   #f3f4f6;
            --muted:  #9ca3af;
            --border: rgba(255,255,255,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text); 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing background orbs */
        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            animation: float-orb-1 25s infinite alternate ease-in-out;
        }
        .orb-1 { top: 10%; left: -150px; }
        .orb-2 { 
            top: 50%; 
            right: -200px; 
            background: radial-gradient(circle, rgba(99, 102, 241, 0.07) 0%, transparent 70%);
            animation-name: float-orb-2;
            animation-duration: 35s;
        }
        
        @keyframes float-orb-1 {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }
        @keyframes float-orb-2 {
            0% { transform: translateY(0) scale(1.1); }
            100% { transform: translateY(-70px) scale(0.9); }
        }

        /* NAVBAR */
        .navbar {
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: none; 
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 10px 30px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            margin-bottom: 0;
        }
        .navbar-brand {
            color: var(--accent) !important;
            font-family: 'DM Serif Display', serif;
            font-size: 30px;
            letter-spacing: 0.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .navbar-brand:hover {
            transform: scale(1.02);
        }
        .navbar-nav li a {
            color: var(--muted) !important;
            font-size: 13px; 
            font-weight: 600;
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            transition: all 0.3s;
            padding: 15px 20px !important;
            position: relative;
        }
        .navbar-nav li a::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .navbar-nav li a:hover { 
            color: white !important; 
        }
        .navbar-nav li a:hover::after {
            transform: scaleX(1);
        }
        .navbar-nav li.active a {
            color: white !important;
        }
        .navbar-nav li.active a::after {
            transform: scaleX(1);
        }

        /* HERO */
        .hero { text-align: center; padding: 100px 20px 40px; }
        .hero h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(38px, 6vw, 64px);
            color: white; line-height: 1.15; margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        .hero h1 em { color: var(--accent); font-style: italic; }
        .hero p { 
            color: var(--muted); 
            font-size: 17px; 
            max-width: 520px; 
            margin: 0 auto; 
            line-height: 1.8; 
            font-weight: 300;
        }

        /* SEARCH */
        .search-wrapper {
            max-width: 700px; 
            margin: 50px auto;
            position: relative; 
            z-index: 50;
        }
        .search-box {
            display: flex; 
            align-items: stretch;
            background: var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        .search-box:focus-within {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1), 0 15px 45px rgba(0,0,0,0.4);
        }
        .search-input {
            flex: 1; 
            background: transparent; 
            border: none;
            padding: 22px 26px; 
            color: white; 
            font-size: 17px;
            font-family: 'DM Sans', sans-serif; 
            outline: none;
        }
        .search-input::placeholder { color: #4b5563; }
        .search-btn {
            background: var(--accent-gradient);
            border: none; 
            color: #030712;
            padding: 0 35px; 
            font-weight: 700; 
            font-size: 16px;
            font-family: 'DM Sans', sans-serif; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .search-btn:hover { 
            filter: brightness(1.1); 
            box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
        }

        /* SUGGESTIONS */
        .suggestions-box {
            position: absolute; 
            width: 100%; 
            top: calc(100% + 12px);
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; 
            overflow: hidden;
            display: none; 
            max-height: 380px; 
            overflow-y: auto;
            z-index: 999; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            padding: 8px 0;
        }
        .suggestion-item {
            display: flex; 
            align-items: center; 
            gap: 16px;
            padding: 14px 22px; 
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s; 
            text-decoration: none; 
            color: inherit;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { 
            background: rgba(16, 185, 129, 0.08); 
            text-decoration: none;
            color: white;
        }
        .sug-title { 
            color: white; 
            font-size: 15px; 
            font-weight: 600; 
            font-family: 'DM Sans', sans-serif;
            line-height: 1.4;
        }
        .sug-author { color: var(--muted); font-size: 12px; margin-top: 4px; }

        /* ERROR */
        .error-box {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5; 
            padding: 18px 28px;
            border-radius: 16px; 
            text-align: center;
            font-size: 15px; 
            margin: 30px auto;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(239,68,68,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .footer {
            text-align: center; 
            color: var(--muted);
            padding: 80px 20px 40px; 
            font-size: 14px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .footer em {
            color: var(--accent);
            font-style: normal;
        }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="/"><span>📚</span> ShelfIQ</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li class="active"><a href="/recommend">Recommend</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="margin-top: 70px; padding-bottom: 120px;">
    <div class="hero">
        <h1>Find Your Next <em>Great</em> Read</h1>
        <p>Enter a book title you love, and let our recommendation engine find similar stories and characters you'll enjoy.</p>
    </div>

    <!-- SEARCH FORM -->
    <div class="search-wrapper">
        <form action="/recommend_books" method="post">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    name="user_input"
                    class="search-input"
                    placeholder="Search by title or author…"
                    autocomplete="off"
                    required
                >
                <button type="submit" class="search-btn">Recommend →</button>
            </div>
        </form>
        <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    {% if error %}
    <div class="error-box">
        <span>⚠</span> {{ error }}
    </div>
    {% endif %}
</div>

<div class="footer">© 2026 ShelfIQ · Built with <em>Flask</em> & <em>Machine Learning</em></div>

<script>
    const searchInput   = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');

    function checkAndFixSuggestionCover(img, title, author) {
        const checkSizeAndFallback = () => {
            if (img.naturalWidth <= 1 && img.naturalHeight <= 1) {
                const src = img.src;
                const match = src.match(/\/images\/P\/([a-zA-Z0-9]+)\./);
                if (match && match[1]) {
                    const isbn = match[1];
                    img.src = `https://covers.openlibrary.org/b/isbn/${isbn}-S.jpg`;
                } else {
                    setSuggestionPlaceholder(img);
                }
            }
        };

        img.onload = checkSizeAndFallback;
        img.onerror = () => {
            const src = img.src;
            const match = src.match(/\/images\/P\/([a-zA-Z0-9]+)\./);
            if (match && match[1]) {
                const isbn = match[1];
                img.src = `https://covers.openlibrary.org/b/isbn/${isbn}-S.jpg`;
            } else {
                setSuggestionPlaceholder(img);
            }
        };
    }

    function setSuggestionPlaceholder(img) {
        const parent = img.parentElement;
        if (!parent) return;
        
        const placeholder = document.createElement('div');
        placeholder.style.width = '46px';
        placeholder.style.height = '64px';
        placeholder.style.borderRadius = '7px';
        placeholder.style.flexShrink = '0';
        placeholder.style.background = 'linear-gradient(135deg, #10b981, #047857)';
        placeholder.style.display = 'flex';
        placeholder.style.alignItems = 'center';
        placeholder.style.justifyContent = 'center';
        placeholder.style.fontSize = '18px';
        placeholder.innerHTML = '📖';
        
        img.style.display = 'none';
        parent.insertBefore(placeholder, img);
    }

    searchInput.addEventListener('keyup', async () => {
        const q = searchInput.value.trim();
        if (q.length < 2) { suggestionsBox.style.display = 'none'; return; }

        try {
            const resp  = await fetch(`/search_suggestions?q=${encodeURIComponent(q)}`);
            const books = await resp.json();

            suggestionsBox.innerHTML = '';
            if (!books.length) { suggestionsBox.style.display = 'none'; return; }

            suggestionsBox.style.display = 'block';
            books.forEach(book => {
                const a = document.createElement('a');
                a.className = 'suggestion-item';
                a.href = '/book/' + encodeURIComponent(book.title);
                
                const img = document.createElement('img');
                img.src = book.image || '';
                img.style.width = '46px';
                img.style.height = '64px';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '7px';
                img.style.flexShrink = '0';
                
                checkAndFixSuggestionCover(img, book.title, book.author);

                const details = document.createElement('div');
                details.innerHTML = `
                    <div class="sug-title">${book.title}</div>
                    <div class="sug-author">✍ ${book.author}</div>
                `;

                a.appendChild(img);
                a.appendChild(details);
                suggestionsBox.appendChild(a);
            });
        } catch (err) {
            console.error('Error fetching suggestions:', err);
        }
    });

    document.addEventListener('click', e => {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target))
            suggestionsBox.style.display = 'none';
    });
</script>
</body>
</html>
