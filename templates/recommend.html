<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse | Recommend</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #060a14;
            --card:   #0d1526;
            --panel:  #111e35;
            --accent: #4ade80;
            --text:   #e2e8f0;
            --muted:  #64748b;
            --border: rgba(255,255,255,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text); min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(6,10,20,0.95);
            border: none; border-radius: 0;
            padding: 0 30px;
            box-shadow: 0 1px 0 var(--border), 0 4px 30px rgba(0,0,0,0.5);
        }
        .navbar-brand {
            color: var(--accent) !important;
            font-family: 'DM Serif Display', serif; font-size: 28px;
        }
        .navbar-nav li a {
            color: var(--muted) !important;
            font-size: 13px; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px;
            transition: color 0.2s;
        }
        .navbar-nav li a:hover { color: var(--accent) !important; }

        /* HERO */
        .hero { text-align: center; padding: 70px 20px 40px; }
        .hero-badge {
            display: inline-block;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.2);
            color: var(--accent); font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            padding: 5px 14px; border-radius: 100px; margin-bottom: 20px;
        }
        .hero h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(34px, 5vw, 58px);
            color: white; line-height: 1.15; margin-bottom: 12px;
        }
        .hero h1 em { color: var(--accent); font-style: italic; }
        .hero p { color: var(--muted); font-size: 16px; max-width: 500px; margin: 0 auto; line-height: 1.8; }

        /* SEARCH */
        .search-wrapper {
            max-width: 680px; margin: 40px auto;
            position: relative; z-index: 50;
        }
        .search-box {
            display: flex; align-items: stretch;
            background: var(--panel);
            border: 1px solid rgba(74,222,128,0.15);
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus-within {
            border-color: rgba(74,222,128,0.4);
            box-shadow: 0 0 0 3px rgba(74,222,128,0.08), 0 10px 40px rgba(0,0,0,0.4);
        }
        .search-input {
            flex: 1; background: transparent; border: none;
            padding: 20px 22px; color: white; font-size: 16px;
            font-family: 'DM Sans', sans-serif; outline: none;
        }
        .search-input::placeholder { color: var(--muted); }
        .search-btn {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            border: none; color: #060a14;
            padding: 0 28px; font-weight: 700; font-size: 15px;
            font-family: 'DM Sans', sans-serif; cursor: pointer;
            transition: filter 0.2s; white-space: nowrap;
        }
        .search-btn:hover { filter: brightness(1.1); }

        /* SUGGESTIONS */
        .suggestions-box {
            position: absolute; width: 100%; top: calc(100% + 10px);
            background: var(--panel);
            border: 1px solid rgba(74,222,128,0.12);
            border-radius: 16px; overflow: hidden;
            display: none; max-height: 340px; overflow-y: auto;
            z-index: 999; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            display: flex; align-items: center; gap: 14px;
            padding: 13px 18px; cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s; text-decoration: none; color: inherit;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(74,222,128,0.05); }
        .suggestion-item img {
            width: 46px; height: 64px; object-fit: cover;
            border-radius: 7px; flex-shrink: 0;
        }
        .sug-title { color: white; font-size: 14px; font-weight: 600; }
        .sug-author { color: var(--muted); font-size: 12px; margin-top: 3px; }

        /* ERROR */
        .error-box {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5; padding: 16px 24px;
            border-radius: 14px; text-align: center;
            font-size: 15px; margin-bottom: 36px;
        }

        .footer {
            text-align: center; color: var(--muted);
            padding: 50px 20px 30px; font-size: 14px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="/">ShelfIQ</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            
        </ul>
    </div>
</nav>

<div class="container">
    <div class="hero">
        
        <h1>Find Your Next <em>Great</em> Read</h1>
        <p>Search a book title and get personalised recommendations instantly.</p>
    </div>

    <!-- SEARCH FORM -->
    <div class="search-wrapper">
        <form action="/recommend_books" method="post">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    name="user_input"
                    class="search-input"
                    placeholder="Search by title or author…"
                    autocomplete="off"
                >
                <button type="submit" class="search-btn">Recommend →</button>
            </div>
        </form>
        <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    {% if error %}
    <div class="error-box">⚠ {{ error }}</div>
    {% endif %}

    
</div>

<script>
    const searchInput   = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');

    searchInput.addEventListener('keyup', async () => {
        const q = searchInput.value.trim();
        if (q.length < 2) { suggestionsBox.style.display = 'none'; return; }

        const resp  = await fetch(`/search_suggestions?q=${encodeURIComponent(q)}`);
        const books = await resp.json();

        suggestionsBox.innerHTML = '';
        if (!books.length) { suggestionsBox.style.display = 'none'; return; }

        suggestionsBox.style.display = 'block';
        books.forEach(book => {
            const a = document.createElement('a');
            a.className = 'suggestion-item';
            a.href = '/book/' + encodeURIComponent(book.title);
            a.innerHTML = `
                <img src="${book.image}" onerror="this.src='https://via.placeholder.com/46x64?text=?'">
                <div>
                    <div class="sug-title">${book.title}</div>
                    <div class="sug-author">✍ ${book.author}</div>
                </div>`;
            suggestionsBox.appendChild(a);
        });
    });

    document.addEventListener('click', e => {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target))
            suggestionsBox.style.display = 'none';
    });
</script>
</body>
</html>
